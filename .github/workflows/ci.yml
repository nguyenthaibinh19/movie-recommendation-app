name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-backend/requirements.txt
      - name: Install CPU inference runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0
          python -m pip install -r src-backend/requirements.txt
      - run: python scripts/download_dataset.py
      - name: Verify model, embeddings and mappings
        run: python scripts/check_artifacts.py
      - name: Test real inference and API flows
        run: python -m unittest discover -s src-backend -p 'test_*.py' -v
